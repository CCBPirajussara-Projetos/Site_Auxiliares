<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Moços - CCB Mocidade</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/recitativo.css">
</head>
<body>
  <div class="navbar">
    📖 Recitativo — CCB Mocidade Pirajussara
    <button onclick="voltarSelecao()" class="logout-btn">Voltar</button>
  </div>

  <div id="recitativo-section">
    <div class="card">
      <div class="recitativo-header">
        <h1>Gerador de Recitativo</h1>
        <p>Preencha os campos e clique em gerar</p>
      </div>

      <div class="field">
        <label>Nomes (opcional — separados por vírgula)</label>
        <input type="text" id="names" placeholder="João, Maria, Pedro">
      </div>

      <div class="row-2">
        <div class="field">
          <label>Livro</label>
          <input type="text" id="book" value="Gênesis">
        </div>
        <div class="field">
          <label>Capítulo</label>
          <input type="text" id="chapter" value="1">
        </div>
      </div>

      <div class="field">
        <label>Verso(s)</label>
        <input type="text" id="verses" value="1-3">
      </div>

      <div class="hint">
        Ex.: <b>1</b> (único) • <b>1-10</b> (intervalo) • <b>1,3,5</b> (específicos) • <b>1-3,5,7-10</b> (combinação)
      </div>

      <div class="row-2">
        <div class="field">
          <label>Data</label>
          <input type="text" id="date">
        </div>
        <div class="field">
          <label>Auxiliar</label>
          <input type="text" id="aux">
        </div>
      </div>

      <div class="field">
        <label>Texto (opcional — deixe vazio para buscar automaticamente)</label>
        <textarea id="text" rows="4"></textarea>
      </div>

      <div class="progress" id="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="status" id="status"></div>

      <button class="primary" id="generateBtn">Gerar Imagem(ns)</button>
      <div class="message" id="message"></div>

      <div class="results" id="results"></div>
    </div>
  </div>

  <script src="js/ficha.js"></script>
  <script src="js/navigation.js"></script>

</body>
</html>
